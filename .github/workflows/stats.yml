name: Generar GitHub Stats

on:
  schedule:
    - cron: "0 6 * * 1" # semanal, lunes 06:00 UTC
  workflow_dispatch: # botón "Run workflow" manual
  push:
    branches: [main]
    paths:
      - "scripts/generate-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar SVGs
        env:
          # Opcional: crea el secret STATS_TOKEN (PAT con read:user y repo) para incluir repos privados.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || (git commit -m "chore: actualizar GitHub stats" && git push)
